<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: white; }
    h1 { margin-bottom: 10px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; }
    .cell { width: 100px; height: 100px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border-radius: 8px; }
    .cell:hover { background: #334155; }
    #status { margin-top: 20px; font-size: 1.2rem; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; background: #38bdf8; color: #0f172a; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board">
    <div class="cell" onclick="makeMove(0)"></div>
    <div class="cell" onclick="makeMove(1)"></div>
    <div class="cell" onclick="makeMove(2)"></div>
    <div class="cell" onclick="makeMove(3)"></div>
    <div class="cell" onclick="makeMove(4)"></div>
    <div class="cell" onclick="makeMove(5)"></div>
    <div class="cell" onclick="makeMove(6)"></div>
    <div class="cell" onclick="makeMove(7)"></div>
    <div class="cell" onclick="makeMove(8)"></div>
  </div>
  <div id="status">Player X's turn</div>
  <button onclick="resetGame()">Restart</button>

  <script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let active = true;

    function makeMove(i) {
      if (board[i] === "" && active) {
        board[i] = currentPlayer;
        document.getElementsByClassName("cell")[i].innerText = currentPlayer;
        if (checkWin()) {
          document.getElementById("status").innerText = `Player ${currentPlayer} Wins! 🎉`;
          active = false;
        } else if (board.every(c => c !== "")) {
          document.getElementById("status").innerText = "It's a Draw! 🤝";
          active = false;
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          document.getElementById("status").innerText = `Player ${currentPlayer}'s turn`;
        }
      }
    }

    function checkWin() {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(w => w.every(i => board[i] === currentPlayer));
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      active = true;
      document.getElementById("status").innerText = "Player X's turn";
      Array.from(document.getElementsByClassName("cell")).forEach(c => c.innerText = "");
    }
  </script>
</body>
</html>
